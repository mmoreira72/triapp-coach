<meta charset="utf-8" />
<!--__HEAD__-->
<title>Tri Squad</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  rel="stylesheet"
  href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
/>
<style>
  :root {
    color-scheme: light;
    --plane: #f4f4f0;
    --surface: #fcfcfb;
    --surface-2: #f0efea;
    --ink: #0b0b0b;
    --ink-2: #52514e;
    --muted: #898781;
    --grid: #e1e0d9;
    --line: rgba(11, 11, 11, 0.1);
    --c-swim: #2a78d6;
    --c-bike: #eb6834;
    --c-run: #1baf7a;
    --c-strength: #eda100;
    --c-other: #898781;
    --a-marcelo: #008300;
    --a-athlete2: #4a3aa7;
    --a-athlete3: #e34948;
    --a-x4: #2a78d6;
    --a-x5: #eda100;
    --a-x6: #e87ba4;
    --good: #0ca30c;
    --warn: #fab219;
    --serious: #ec835a;
    --crit: #d03b3b;
    --font-head: "Barlow Semi Condensed", "Arial Narrow", system-ui, sans-serif;
    --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    --radius: 10px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --plane: #111311;
      --surface: #1a1a19;
      --surface-2: #232321;
      --ink: #ffffff;
      --ink-2: #c3c2b7;
      --muted: #898781;
      --grid: #2c2c2a;
      --line: rgba(255, 255, 255, 0.1);
      --c-swim: #3987e5;
      --c-bike: #d95926;
      --c-run: #199e70;
      --c-strength: #c98500;
      --c-other: #898781;
      --a-marcelo: #0ca30c;
      --a-athlete2: #9085e9;
      --a-athlete3: #e66767;
      --a-x4: #3987e5;
      --a-x5: #c98500;
      --a-x6: #d55181;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --plane: #111311;
    --surface: #1a1a19;
    --surface-2: #232321;
    --ink: #ffffff;
    --ink-2: #c3c2b7;
    --muted: #898781;
    --grid: #2c2c2a;
    --line: rgba(255, 255, 255, 0.1);
    --c-swim: #3987e5;
    --c-bike: #d95926;
    --c-run: #199e70;
    --c-strength: #c98500;
    --c-other: #898781;
    --a-marcelo: #0ca30c;
    --a-athlete2: #9085e9;
    --a-athlete3: #e66767;
    --a-x4: #3987e5;
    --a-x5: #c98500;
    --a-x6: #d55181;
  }
  * {
    box-sizing: border-box;
  }
  [hidden] {
    display: none !important;
  }
  html {
    -webkit-text-size-adjust: 100%;
    text-size-adjust: 100%;
  } /* iOS inflates text in wide table cells otherwise */
  body {
    margin: 0;
    background: var(--plane);
    color: var(--ink);
    font-family: var(--font-body);
    font-size: 14px;
    line-height: 1.45;
    padding-inline: 16px;
    padding-block: 0 48px;
  }
  h1,
  h2,
  h3 {
    font-family: var(--font-head);
    font-weight: 600;
    margin: 0;
    text-wrap: balance;
    letter-spacing: 0.01em;
  }
  h1 {
    font-size: 26px;
    line-height: 1.1;
  }
  h2 {
    font-size: 20px;
    margin-block: 28px 12px;
  }
  h3 {
    font-size: 17px;
  }
  p {
    margin: 0;
  }
  button {
    font: inherit;
    color: inherit;
  }
  .top {
    position: sticky;
    top: env(safe-area-inset-top, 0px);
    z-index: 5;
    background: var(--plane);
    margin-inline: -16px;
    padding: 14px 16px 0;
    border-bottom: 1px solid var(--grid);
  }
  .top-row {
    display: flex;
    flex-wrap: wrap;
    align-items: flex-end;
    justify-content: space-between;
    gap: 10px 24px;
    max-width: 1240px;
    margin-inline: auto;
  }
  .brand small {
    display: block;
    color: var(--ink-2);
    font-size: 13px;
    margin-top: 2px;
  }
  .tabs {
    display: flex;
    gap: 4px;
    overflow-x: auto;
    max-width: 100%;
  }
  .tab {
    background: none;
    border: 0;
    border-bottom: 3px solid transparent;
    padding: 10px 14px 12px;
    font-family: var(--font-head);
    font-size: 16px;
    font-weight: 600;
    color: var(--ink-2);
    cursor: pointer;
    white-space: nowrap;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .tab .dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--dot);
  }
  .tab[aria-selected="true"] {
    color: var(--ink);
    border-bottom-color: var(--ink);
  }
  .tab:focus-visible,
  .seg button:focus-visible,
  .ghost:focus-visible {
    outline: 2px solid var(--a-athlete2);
    outline-offset: 2px;
  }
  .filters {
    display: flex;
    flex-wrap: wrap;
    gap: 10px 18px;
    align-items: center;
    max-width: 1240px;
    margin: 16px auto 0;
  }
  .filters .lbl {
    color: var(--ink-2);
    font-size: 13px;
    margin-right: 6px;
  }
  .seg {
    display: inline-flex;
    border: 1px solid var(--grid);
    border-radius: 8px;
    overflow: hidden;
    background: var(--surface);
  }
  .seg button {
    border: 0;
    background: none;
    padding: 6px 12px;
    cursor: pointer;
    color: var(--ink-2);
    font-size: 13px;
  }
  .seg button[aria-pressed="true"] {
    background: var(--ink);
    color: var(--surface);
  }
  main {
    max-width: 1240px;
    margin-inline: auto;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(12, 1fr);
    gap: 14px;
  }
  .card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 14px 16px 12px;
    grid-column: span 12;
    min-width: 0;
  }
  .span-6 {
    grid-column: span 6;
  }
  .span-4 {
    grid-column: span 4;
  }
  .span-8 {
    grid-column: span 8;
  }
  .span-3 {
    grid-column: span 3;
  }
  @media (max-width: 900px) {
    .span-6,
    .span-4,
    .span-8,
    .span-3 {
      grid-column: span 12;
    }
  }
  @media (min-width: 600px) and (max-width: 900px) {
    .span-3,
    .span-4,
    .span-6 {
      grid-column: span 6;
    }
  }
  .card-head {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 12px;
    margin-bottom: 10px;
  }
  .card-head .sub {
    color: var(--ink-2);
    font-size: 13px;
    margin-top: 2px;
  }
  .ghost {
    border: 1px solid var(--grid);
    background: none;
    border-radius: 6px;
    padding: 3px 9px;
    font-size: 12px;
    color: var(--ink-2);
    cursor: pointer;
    flex: none;
  }
  .ghost:hover {
    background: var(--surface-2);
  }
  .chart-wrap {
    position: relative;
    width: 100%;
  }
  .table-wrap {
    overflow-x: auto;
    max-height: 360px;
    overflow-y: auto;
  }
  table {
    border-collapse: collapse;
    width: 100%;
    font-size: 13px;
    font-variant-numeric: tabular-nums;
  }
  th,
  td {
    text-align: right;
    padding: 6px 8px;
    border-bottom: 1px solid var(--grid);
    white-space: nowrap;
  }
  th:first-child,
  td:first-child {
    text-align: left;
  }
  th {
    color: var(--ink-2);
    font-weight: 500;
    position: sticky;
    top: 0;
    background: var(--surface);
  }
  td.txt {
    text-align: left;
    white-space: normal;
    min-width: 180px;
  }
  .kpis {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 12px;
  }
  .hero {
    grid-column: 1/-1;
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    gap: 8px 20px;
  }
  .hero .big {
    font-size: 52px;
    font-weight: 600;
    line-height: 1;
    font-family: var(--font-body);
  }
  .hero .lbl {
    font-size: 13px;
    color: var(--ink-2);
  }
  .tile {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 12px 14px;
    min-width: 0;
  }
  .tile .lbl {
    color: var(--ink-2);
    font-size: 12.5px;
  }
  .tile .val {
    font-size: 24px;
    font-weight: 600;
    margin-top: 2px;
    line-height: 1.15;
  }
  .tile .delta {
    font-size: 12.5px;
    color: var(--ink-2);
    margin-top: 2px;
  }
  .tile .delta.up {
    color: var(--good);
  }
  .tile .delta.down {
    color: var(--crit);
  }
  .tile .delta.warn {
    color: var(--ink);
    font-weight: 600;
  }
  .tile .delta.warn::before {
    content: "⚠ ";
    color: var(--warn);
  }
  .mini {
    margin: 8px 0;
    font-size: 12.5px;
    width: auto;
  }
  .exec-main td {
    border-bottom: none;
    vertical-align: top;
  }
  .exec-detail td {
    padding-top: 0;
  }
  .mini td,
  .mini th {
    padding: 3px 8px;
  }
  details summary {
    cursor: pointer;
    color: var(--muted);
    font-size: 12.5px;
    margin-top: 2px;
  }
  .help-btn {
    margin-left: 8px;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    border: 1px solid var(--grid);
    background: var(--surface-2);
    color: var(--ink-2);
    font: 600 12px/18px var(--font-body, system-ui);
    font-style: italic;
    cursor: pointer;
    padding: 0;
    vertical-align: 2px;
  }
  .help-btn[aria-expanded="true"] {
    background: var(--ink);
    color: var(--surface);
    border-color: var(--ink);
  }
  .help {
    margin: 6px 0 10px;
    padding: 10px 12px;
    border-radius: 8px;
    background: var(--surface-2);
    color: var(--ink);
    font-size: 13.5px;
    line-height: 1.5;
  }
  .skill-help {
    margin-top: 8px;
  }
  .skill-help summary,
  .glossary summary {
    cursor: pointer;
    color: var(--muted);
    font-size: 12.5px;
  }
  .skill-help p {
    font-size: 13px;
    margin: 6px 0 0;
    color: var(--ink-2);
  }
  .glossary {
    margin-top: 16px;
    background: var(--surface);
    border: 1px solid var(--grid);
    border-radius: 10px;
    padding: 12px 16px;
  }
  .glossary summary {
    font-size: 14px;
    color: var(--ink);
    font-weight: 600;
  }
  .glossary dl {
    display: grid;
    grid-template-columns: max-content 1fr;
    gap: 6px 14px;
    margin: 12px 0 4px;
    font-size: 13.5px;
  }
  .glossary dt {
    font-weight: 600;
  }
  .glossary dd {
    margin: 0;
    color: var(--ink-2);
  }
  @media (max-width: 600px) {
    .glossary dl {
      grid-template-columns: 1fr;
    }
    .glossary dd {
      margin-bottom: 6px;
    }
  }
  .latest .note-cell {
    padding-top: 0;
  }
  @media (max-width: 600px) {
    .latest tr:not(.exec-detail) > :nth-child(5),
    .latest tr:not(.exec-detail) > :nth-child(8),
    .latest tr:not(.exec-detail) > :nth-child(9) {
      display: none;
    }
    .latest tr.exec-detail > td:first-child {
      display: none;
    }
    .latest td,
    .latest th {
      padding-left: 6px;
      padding-right: 6px;
    }
  }
  .zone-bar {
    display: flex;
    gap: 2px;
    height: 6px;
    margin-top: 6px;
    max-width: 420px;
  }
  .zone-bar i {
    border-radius: 3px;
    background: var(--zc, var(--muted));
    min-width: 3px;
  }
  :root {
    /* training-zone colours, as on the watch: Z1 blue, Z2 green, Z3 orange, Z4 red, above threshold purple, darker with
       intensity (power Z5 / Z6 / Z7, heart rate Z5a / Z5b / Z5c) */
    --z1: #3d85d8;
    --z2: #2fa35f;
    --z3: #f0922e;
    --z4: #d9433b;
    --z5: #a57be3;
    --z6: #8150c9;
    --z7: #5a2d9c;
  }
  .zone-legend {
    display: flex;
    flex-wrap: wrap;
    gap: 4px 12px;
    margin-top: 6px;
    font-size: 12px;
    color: var(--ink-2);
  }
  .zone-legend span {
    display: inline-flex;
    align-items: center;
    gap: 5px;
  }
  .zone-legend i {
    width: 14px;
    height: 6px;
    border-radius: 3px;
    background: var(--zc);
  }
  .exec-date .chip {
    margin-right: 4px;
  }
  .race-pick {
    margin: 4px 0 14px;
  }
  .exec-list {
    display: flex;
    flex-direction: column;
  }
  .exec {
    padding: 12px 0;
    border-top: 1px solid var(--grid);
  }
  .exec:first-child {
    border-top: none;
    padding-top: 4px;
  }
  .exec-head {
    display: flex;
    flex-wrap: wrap;
    gap: 6px 12px;
    align-items: flex-start;
    justify-content: space-between;
  }
  .exec-title {
    display: flex;
    flex-direction: column;
    gap: 2px;
    min-width: 0;
  }
  .exec-title b {
    font-size: 15px;
    overflow-wrap: anywhere;
  }
  .exec-date {
    font-size: 12.5px;
    color: var(--muted);
  }
  .exec-facts {
    list-style: none;
    margin: 6px 0 0;
    padding: 0;
    display: flex;
    flex-wrap: wrap;
    gap: 2px 0;
    font-size: 13px;
    color: var(--ink-2);
  }
  .exec-facts li:not(:last-child)::after {
    content: "·";
    margin: 0 8px;
    color: var(--muted);
  }
  .exec-note {
    margin: 6px 0 0;
    font-size: 13.5px;
    line-height: 1.5;
    color: var(--ink);
  }
  .exec details {
    margin-top: 6px;
  }
  .x-scroll {
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
  }
  .type-pill {
    margin-top: 4px;
    font-size: 12px;
    padding: 2px 8px;
  }
  .note-cell {
    font-size: 13px;
    color: var(--ink-2);
    line-height: 1.5;
    margin: 2px 0 6px;
  }
  .pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    border-radius: 999px;
    padding: 3px 10px;
    font-size: 12.5px;
    background: var(--surface-2);
    color: var(--ink);
  }
  .pill i {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--pc, var(--muted));
  }
  .chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 12.5px;
  }
  .chip i {
    width: 9px;
    height: 9px;
    border-radius: 2px;
    background: var(--cc);
  }
  .notes {
    margin: 0;
    padding-left: 18px;
    color: var(--ink-2);
    font-size: 13px;
  }
  .notes li {
    margin-block: 4px;
  }
  .insights {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 12px;
  }
  .insight {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 12px 14px;
  }
  .insight b {
    font-family: var(--font-head);
    font-size: 15px;
    display: block;
    margin-bottom: 4px;
  }
  .insight p {
    color: var(--ink-2);
    font-size: 13.5px;
  }
  .cmp {
    width: 100%;
    border-collapse: collapse;
  }
  .cmp th,
  .cmp td {
    padding: 8px 8px;
    border-bottom: 1px solid var(--grid);
    text-align: right;
    font-variant-numeric: tabular-nums;
  }
  .cmp th:first-child,
  .cmp td:first-child {
    text-align: left;
    color: var(--ink-2);
    font-weight: 400;
  }
  .cmp thead th {
    font-family: var(--font-head);
    font-size: 15px;
    color: var(--ink);
  }
  .cmp thead th span {
    display: inline-flex;
    align-items: center;
    gap: 7px;
  }
  .cmp thead th i {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--dot);
  }
  .nut-rows {
    display: grid;
    gap: 10px;
    margin: 6px 0 4px;
  }
  .nut-row b {
    display: block;
    font-size: 13px;
    color: var(--ink-2);
  }
  .nut-row p {
    margin: 2px 0 0;
    font-size: 14px;
    line-height: 1.45;
  }
  .nut-list {
    margin: 0;
    padding-left: 18px;
    display: grid;
    gap: 3px;
    font-size: 14px;
  }
  .coach-note {
    border-left: 3px solid var(--accent, #5cc27a);
    padding: 6px 10px;
    margin: 8px 0;
    font-size: 14px;
  }
  .nut-form {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    gap: 8px;
    margin-top: 8px;
  }
  .nut-form textarea,
  .nut-form > div {
    grid-column: 1 / -1;
  }
  .nut-field {
    display: grid;
    gap: 2px;
    font-size: 12px;
  }
  .if-pick {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
    margin-top: 10px;
  }
  .if-pick input {
    font: inherit;
    width: 70px;
    padding: 4px 6px;
  }
  .ath-pick {
    font: inherit;
    font-size: 16px;
    font-weight: 600;
    padding: 8px 12px;
    border-radius: 8px;
    border: 1px solid var(--grid);
    background: var(--surface);
    color: var(--ink);
    max-width: 100%;
  }
  .entered {
    display: flex;
    gap: 6px;
    align-items: center;
    margin: -4px 0 10px;
  }
  .race-soon h4 {
    margin: 12px 0 6px;
  }
  .proj-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 14px;
    font-variant-numeric: tabular-nums;
  }
  .proj-table th,
  .proj-table td {
    text-align: left;
    padding: 6px 8px;
    border-bottom: 1px solid var(--grid);
  }
  .proj-table tr.warn td:nth-child(3) {
    color: var(--warn, #c98a1b);
  }
  .proj-ev {
    margin: 10px 0 0;
    padding-left: 18px;
    display: grid;
    gap: 2px;
  }
  .msg.highlight {
    outline: 2px solid var(--accent, #5cc27a);
  }
  .muted {
    color: var(--muted);
  }
  .foot {
    color: var(--muted);
    font-size: 12px;
    margin-top: 28px;
    max-width: 1240px;
    margin-inline: auto;
  }
  .nochart {
    padding: 20px;
    color: var(--ink-2);
    font-size: 13px;
  }
  .gate {
    max-width: 400px;
    margin: 56px auto;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 24px;
    display: grid;
    gap: 12px;
  }
  .gate input[type="password"] {
    font: inherit;
    padding: 10px 12px;
    border: 1px solid var(--grid);
    border-radius: 8px;
    background: var(--plane);
    color: var(--ink);
    width: 100%;
  }
  .gate button.primary {
    font: inherit;
    padding: 10px 14px;
    border: 0;
    border-radius: 8px;
    background: var(--ink);
    color: var(--surface);
    font-weight: 600;
    cursor: pointer;
  }
  .gate button.primary:focus-visible,
  .gate input:focus-visible {
    outline: 2px solid var(--a-athlete2);
    outline-offset: 2px;
  }
  .gate-err {
    color: var(--crit);
    font-size: 13px;
    min-height: 1.2em;
  }
  .gate-rem {
    font-size: 13px;
    color: var(--ink-2);
    display: flex;
    gap: 8px;
    align-items: center;
  }
  .an-top {
    display: grid;
    grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr);
    gap: 14px;
    align-items: start;
  }
  @media (max-width: 900px) {
    .an-top {
      grid-template-columns: 1fr;
    }
  }

              el("small", { class: "sub", text: "Resposta rápida do iPhone · a resposta completa do box vem a seguir…" }),
            );
            log.scrollTop = log.scrollHeight;
          }
          const devP = Promise.resolve(local0);
          if (!quick) bot.textContent = "A analisar…";
          let text = "";
          try {
            if (navigator.onLine === false) throw new Error("sem rede");
            const ctl = new AbortController(),
              timer = setTimeout(() => ctl.abort(), 15000);
            const r = await fetch(`/api/ask/${encodeURIComponent(a)}`, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              credentials: "same-origin",
              body: JSON.stringify({ question: q, history: hist }),
              signal: ctl.signal,
            }).finally(() => clearTimeout(timer));
            if (!r.ok) throw new Error(r.status === 403 ? "Sem permissão para este atleta." : `Erro ${r.status}`);
            const reader = r.body.getReader(),
              dec = new TextDecoder();
            for (;;) {
              const { done, value } = await reader.read();
              if (done) break;
              text += dec.decode(value, { stream: true });
              const shown = cleanTex(text);
              if (!shown && !quick && text.includes("\u2060")) bot.textContent = "A pensar na resposta (pode levar um minuto)…";
              if (shown) {
                boxOn = true;
                bot.classList.remove("wait");
                bot.textContent = shown;
                log.scrollTop = log.scrollHeight;
              }
            }
            text = cleanTex(text);
            if (!text) throw new Error("o box não respondeu");
            bot.textContent = "";
            bot.append(
              mdLite(text),
              ...(quick ? [el("small", { class: "sub", text: "Resposta completa do box (substituiu a rápida do iPhone)." })] : []),
            );
            hist.push({ role: "user", content: q }, { role: "assistant", content: text });
          } catch (e) {
            bot.classList.remove("wait");
            const err = e.name === "AbortError" ? "o box não respondeu" : e.message;
            const local = viaBox ? await askOnDevice(a, q, hist) : await devP;
            if (local && local.text) {
              bot.textContent = "";
              bot.append(mdLite(local.text), el("small", { class: "sub", text: `Resposta do modelo do iPhone: ${err}.` }));
              hist.push({ role: "user", content: q }, { role: "assistant", content: local.text });
            } else
              bot.textContent =
                `Não foi possível obter resposta: ${err}.` + (local && local.why ? ` O modelo do iPhone também não: ${local.why}.` : "");
          }
          send.disabled = false;
          ta.focus();
        }
        const form = el("form", { class: "chat-form" }, [ta, send]);
        form.addEventListener("submit", (e) => {
          e.preventDefault();
          ask();
        });
        if (!hist.length) {
          try {
            fetch(`/api/warm/${encodeURIComponent(a)}`, { method: "POST", credentials: "same-origin" });
          } catch (_) {}
          cacheFacts(a);
        }
        ta.addEventListener("keydown", (e) => {
          if (e.key === "Enter" && !e.shiftKey) {
            e.preventDefault();
            ask();
          }
        });
        return el("section", { class: "chat" }, [
          el("h3", { text: "Pergunta à análise" }),
          el("p", {
            class: "sub",
            text: "Responde só com base nos achados das skills, nas tuas métricas e no contexto registado abaixo. Corre no modelo local da box.",
          }),
          log,
          hist.length ? null : chips,
          form,
        ]);
      }

      // Alerts built from specific sessions can be ignored (athlete or coach): they turn into info until a new session of the
      // same kind appears (skills_engine.apply_acks)
      function ackControl(a, f) {
        if (!f.evidence || !f.evidence.length) return null;
        if (!f.ignored && !["alert", "watch"].includes(f.severity)) return null;
        const msg = el("span", { class: "sub ack-msg", "aria-live": "polite" });
        const send = async (undo) => {
          msg.textContent = "a guardar…";
          try {
            const r = await fetch(`/api/ack/${encodeURIComponent(a)}`, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              credentials: "same-origin",
              body: JSON.stringify({ title: f.title, evidence: f.evidence, undo }),
            });
            if (!r.ok) throw new Error(r.status);
            const j = await r.json();
            msg.textContent = j.refreshing
              ? "Guardado. A análise está a ser refeita: recarrega daqui a 2 ou 3 minutos."
              : "Guardado. Muda na próxima sincronização.";
            btn.disabled = true;
          } catch (e) {
            msg.textContent = "Não foi possível guardar.";
          }
        };
        const btn = el("button", {
          type: "button",
          class: "ghost",
          text: f.ignored ? "Voltar a considerar" : f.evidence.length === 1 ? "Ignorar esta sessão" : "Ignorar estas sessões",
          onclick: () => send(!!f.ignored),
        });
        return el("div", { class: "ack" }, [
          el("details", {}, [
            el("summary", { text: `Ver ${f.evidence.length === 1 ? "a sessão" : `as ${f.evidence.length} sessões`}` }),
            el(
              "ul",
              { class: "ack-list" },
              f.evidence.map((t) => el("li", { text: t.replace("T", " ") })),
            ),
          ]),
          btn,
          msg,
        ]);
      }

      // ---------- team view ----------
      // Coach: the races of the next 15 days with the athletes entered, their prediction, the bike IF and the fuelling advice
      function upcomingRaces() {
        const all = DATA.races_target || {};
        const soon = Object.entries(all)
          .filter(([, R]) => R.days_to_race >= 0 && R.days_to_race <= 15)
          .sort((x, y) => x[1].days_to_race - y[1].days_to_race);
        const later = Object.entries(all).filter(
          ([, R]) => R.days_to_race > 15 && Object.values(R.athletes || {}).some((P) => (P.plan || {}).entered),
        );
        if (!soon.length && !later.length) return null;
        const row = (slug, R, a, P) => {
          const rec = P.bike && P.bike.options ? P.bike.options[P.bike.recommended_if.toFixed(2)] : null;
          const N = P.nutrition;
          const A = DATA.athletes[a] || {};
          return el("tr", {}, [
            el("td", {}, [el("a", { href: `/board/${encodeURIComponent(a)}`, text: a })]),
            el("td", { text: P.total ? P.total.time : "–" }),
            el("td", {
              text:
                P.sport === "run" && P.run
                  ? `${fmtPace(P.run.pace)} /km`
                  : rec
                    ? `IF ${P.bike.recommended_if.toFixed(2)}${P.bike.coach_if ? " ✎" : ""} · ${rec.target_w} W`
                    : "–",
            }),
            el("td", { text: N ? (N.note ? "✓ recomendação" : "sem recomendação") : "–" }),
            el("td", { text: A.pmc && A.pmc.now ? `CTL ${nf0.format(A.pmc.now.ctl)} · TSB ${nf0.format(A.pmc.now.tsb)}` : "–" }),
          ]);
        };
        const block = ([slug, R]) => {
          const ents = Object.entries(R.athletes || {}).filter(([, P]) => (P.plan || {}).entered);
          return el("div", { class: "race-soon" }, [
            el("h4", {
              text: `${R.race.name} · ${fmtDayY(R.race.date)} · ${R.days_to_race === 0 ? "hoje" : "faltam " + R.days_to_race + " dias"}`,
            }),
            ents.length
              ? el("div", { class: "table-wrap", style: "max-height:none" }, [
                  el("table", {}, [
                    el("thead", {}, [
                      el(
                        "tr",
                        {},
                        ["Atleta", "Previsão", "Bike / ritmo", "Nutrição", "Forma hoje"].map((h) => el("th", { text: h })),
                      ),
                    ]),
                    el(
                      "tbody",
                      {},
                      ents.map(([a, P]) => row(slug, R, a, P)),
                    ),
                  ]),
                ])
              : el("p", { class: "sub", text: "Nenhum atleta marcado como inscrito: marca-o no separador Prova do atleta." }),
          ]);
        };
        return el("section", { class: "card span-12", style: "margin-bottom:14px" }, [
          el("header", { class: "card-head" }, [
            el("div", {}, [
              el("h3", { text: "Provas dos próximos 15 dias" }),
              el("p", {
                class: "sub",
                text: "Atletas inscritos, previsão, IF do bike (✎ = escolhido por ti), recomendação de nutrição e forma de hoje.",
              }),
            ]),
          ]),
          ...(soon.length ? soon.map(block) : [el("p", { class: "sub", text: "Nenhuma prova nos próximos 15 dias." })]),
          ...(later.length
            ? [
                el("p", {
                  class: "sub",
                  text:
                    "Depois: " +
                    later
                      .sort((x, y) => x[1].days_to_race - y[1].days_to_race)
                      .map(([, R]) => `${R.race.name} (${fmtDayY(R.race.date)})`)
                      .join(" · "),
                }),
              ]
            : []),
        ]);
      }
